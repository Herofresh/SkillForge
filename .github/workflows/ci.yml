name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Use the npm pinned in package.json devEngines, so CI and lockfile:fix agree (ADR-029).
      - run: npm install -g npm@$(node -p "require('./package.json').devEngines.packageManager.version")
      - run: npm run lockfile:check
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run progressions:check

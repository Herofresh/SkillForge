# Handstand and balance
#
# One block per exercise (a "node"). Field guide: content/progressions/README.md
# After editing, run:  npm run progressions:build   (checks the file and regenerates the app data)
#
# Keep nodes in order (easiest first). Use gaps of 10 so new nodes can go in between.
branch: handstand
nodes:
  - id: wall_plank
    name: Wall plank
    order: 10
    og_level: 0
    metric: hold_s
    working_range: { min: 10, max: 30 }
    trial: { sets: 3, target: 30 }
    prerequisites:
      - node: wrist_prep
        level: 5
        kind: recommended
    skill: true
    patterns: [balance, vertical_push]
    equipment:
      - wall
    cues:
      - Start in a push-up position with the feet against the wall.
      - Walk the feet up the wall until the body forms an L (hips over the shoulders).
      - Push tall through the shoulders; arms straight, head between the arms.
    sources:
      - https://www.calisthenics-101.co.uk/wp-content/uploads/2020/05/Bodyweight-Fitness-Progressions-Version-5.4.pdf
      - https://gmb.io/handstand/
    review:
      status: draft
      notes: ""

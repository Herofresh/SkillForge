# Acrobatics: ground tumbling and safe falling (rolls, judo breakfalls, cartwheel to aerial)
#
# Our own synthesis from gymnastics teaching progressions (NRG), the Judo Canada breakfall guide
# and GMB tumbling. OG2 has no tumbling chart, so every og_level here is inferred (see the verify
# notes), and no source gives rep standards: the trials are placeholders.
#
# Two chains share this branch (og_level must never drop as order rises, so they interleave):
#   rolls and falls:  tuck rock -> back breakfall -> side breakfall -> forward shoulder roll ...
#   cartwheel path:   bunny-hop cartwheel -> cartwheel -> quarter-turn cartwheel -> round-off ...
#
# Train on a soft surface (grass, a mat, a carpet) when you can; the app has no mat equipment tag,
# so the equipment is "floor". These are not straight-arm tendon skills (ADR-010 does not apply).
#
# One block per exercise (a "node"). Field guide: content/progressions/README.md
# After editing, run:  npm run progressions:build   (checks the file and regenerates the app data)
#
# Keep nodes in order (easiest first). Use gaps of 10 so new nodes can go in between.
branch: acrobatics
nodes:
  # --- Rolls and breakfalls ---
  - id: tuck_rock
    name: Tuck rock
    order: 10
    og_level: 0
    metric: reps
    working_range: { min: 5, max: 10 }
    trial: { sets: 3, target: 10 }
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    cues:
      - Sit in a tight ball, knees to the chest, chin tucked in.
      - Rock back onto the shoulder blades and forward again onto the feet.
      - Arms reach straight forward, don't clutch the knees; the head never touches the floor.
    sources:
      - https://www.nrgq.co.uk/wp-content/uploads/2018/12/Foundation_Teaching-Progressions-FORWARD-ROLL-_-VARIATIONS.pdf
      - https://www.pinngym.com/favorite-backward-roll-progressions
    verify: >-
      The first step of both the forward and the backward roll (NRG, Pinn "rock and roll"); no
      source gives a rep standard, so the 3 x 10 trial is a placeholder.
    review:
      status: draft
      notes: ""

  - id: back_breakfall
    name: Back breakfall (ushiro ukemi)
    order: 20
    og_level: 0
    metric: reps
    working_range: { min: 5, max: 10 }
    trial: { sets: 3, target: 10 }
    prerequisites:
      - node: tuck_rock
        level: 5
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: tuck_rock
    cues:
      - Chin to the chest, eyes on your belt; the head never touches the floor.
      - Sit the hips down close to the heels and roll back on a rounded back.
      - Slap the floor with both whole arms at about 45 degrees from the body, palms down.
      - Build up from lying, to sitting, to squatting, to standing; stay low until it is easy.
    sources:
      - https://judocanada.org/wp-content/uploads/2023/07/Guide-Chutes_2023_EN.pdf
      - https://www.judo-encyclopedia.com/judo_encyclopedia/ukemi-waza/
    verify: >-
      Judo Canada teaches it first, in stages from lying to standing; OG level 0 is assumed and the
      3 x 10 trial is a placeholder (judo practises falls every session, not to a rep standard).
    review:
      status: draft
      notes: ""

  - id: forward_roll
    name: Forward roll
    order: 30
    og_level: 1
    metric: reps
    working_range: { min: 3, max: 6 }
    trial: { sets: 3, target: 6 }
    prerequisites:
      - node: tuck_rock
        level: 5
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: tuck_rock
    cues:
      - Squat, hands shoulder-width on the floor, hips high.
      - Tuck the chin to the chest and roll onto the back of the head and shoulders, never the top of the head.
      - Stay in a tight ball and reach forward to stand up without pushing off the floor behind you.
    sources:
      - https://www.nrgq.co.uk/wp-content/uploads/2018/12/Foundation_Teaching-Progressions-FORWARD-ROLL-_-VARIATIONS.pdf
    verify: OG level 1 is inferred; the 3 x 6 trial is a placeholder.
    review:
      status: draft
      notes: ""

  - id: side_breakfall
    name: Side breakfall (yoko ukemi)
    order: 40
    og_level: 1
    metric: reps
    working_range: { min: 6, max: 10 }
    trial: { sets: 3, target: 10 }
    prerequisites:
      - node: back_breakfall
        level: 5
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: back_breakfall
    cues:
      - Alternate sides; count every fall as one rep.
      - Swing one leg across the body and sit down close to the heel of the standing leg.
      - Land on the side, not the back; slap with the whole arm on the falling side at about 45 degrees.
      - Chin tucked, head up off the floor; legs apart, never crossed.
    sources:
      - https://judocanada.org/wp-content/uploads/2023/07/Guide-Chutes_2023_EN.pdf
      - https://www.judo-encyclopedia.com/judo_encyclopedia/ukemi-waza/
    verify: >-
      Judo Canada teaches it second, after the back breakfall; OG level 1 is inferred and the
      3 x 10 trial is a placeholder.
    review:
      status: draft
      notes: ""

  - id: forward_shoulder_roll
    name: Forward shoulder roll (zenpo kaiten ukemi)
    order: 50
    og_level: 1
    metric: reps
    working_range: { min: 4, max: 8 }
    trial: { sets: 3, target: 8 }
    prerequisites:
      - node: side_breakfall
        level: 5
        note: The roll ends in a side breakfall.
      - node: forward_roll
        level: 5
        kind: recommended
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: side_breakfall
    cues:
      - Alternate sides; count every roll as one rep.
      - Roll diagonally along the arm and the back of the shoulder to the opposite hip; the head stays off the floor.
      - Chin in, look towards the far shoulder; keep the leading arm round like a wheel.
      - Start from kneeling, then from standing, then walking; slap the floor with the free arm as you finish.
    sources:
      - https://judocanada.org/wp-content/uploads/2023/07/Guide-Chutes_2023_EN.pdf
      - https://gmb.io/tumbling/
      - https://www.judo-encyclopedia.com/judo_encyclopedia/ukemi-waza/
    verify: >-
      Judo Canada teaches it third (kneeling, standing, on the move); OG level 1 is inferred and
      the 3 x 8 trial is a placeholder.
    review:
      status: draft
      notes: ""

  - id: backward_shoulder_roll
    name: Backward shoulder roll
    order: 60
    og_level: 1
    metric: reps
    working_range: { min: 4, max: 8 }
    trial: { sets: 3, target: 8 }
    prerequisites:
      - node: forward_shoulder_roll
        level: 5
      - node: back_breakfall
        level: 5
        kind: recommended
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: back_breakfall
    cues:
      - Alternate sides; count every roll as one rep.
      - Sit back, turn the head away and roll over the back of one shoulder, not the neck.
      - Tuck the head under the other arm; walk the knees or feet around to finish.
    sources:
      - https://gmb.io/tumbling/
    verify: >-
      GMB teaches it after the forward shoulder roll; OG level 1 is inferred and the 3 x 8 trial is
      a placeholder.
    review:
      status: draft
      notes: ""

  # --- Cartwheel path (starts from the wall plank; see handstand.yaml) ---
  - id: bunny_hop_cartwheel
    name: Bunny-hop cartwheel
    order: 70
    og_level: 1
    metric: reps
    working_range: { min: 5, max: 10 }
    trial: { sets: 3, target: 10 }
    prerequisites:
      - node: wall_plank
        level: 5
        note: Comfortable taking your weight on straight arms with the hips over the shoulders.
      - node: wrist_prep
        level: 5
        kind: recommended
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    cues:
      - Stand sideways to a line, put both hands down on it and hop both feet over to the other side.
      - Arms straight, weight on the hands; fingers turned sideways to the line.
      - Lift the hips a little higher with every hop; sequence foot, hand, hand, foot, foot.
    sources:
      - https://www.nrgq.co.uk/wp-content/uploads/2018/12/Foundation_Teaching-Progressions-CARTWHEELS.pdf
      - https://gmb.io/tumbling/
    verify: >-
      NRG: "early attempts may just be bunny-hopping around from 2 feet to 2 feet"; GMB starts
      from hands-on-the-ground cartwheels. OG level 1 is inferred; the 3 x 10 trial is a placeholder.
    review:
      status: draft
      notes: ""

  - id: backward_roll
    name: Backward roll
    order: 80
    og_level: 2
    metric: reps
    working_range: { min: 3, max: 6 }
    trial: { sets: 3, target: 6 }
    prerequisites:
      - node: forward_roll
        level: 5
      - node: push_up
        level: 5
        kind: recommended
        note: The arms have to push the body over the head, off the neck.
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: tuck_rock
    cues:
      - Hands by the ears, palms up, like holding a pizza tray; chin tucked in.
      - Rock back; the hands and the back of the head touch the floor together.
      - Push hard through the hands so the neck carries no weight, and land on the feet, not the knees.
      - Learn it down a slope first; stop if you feel pressure in the neck.
    sources:
      - https://www.pinngym.com/favorite-backward-roll-progressions
      - https://recgympros.com/drills-for-teaching-back-rolls/
    verify: OG level 2 is inferred; the 3 x 6 trial is a placeholder.
    review:
      status: draft
      notes: ""

  - id: cartwheel
    name: Cartwheel
    order: 90
    og_level: 2
    metric: reps
    working_range: { min: 3, max: 6 }
    trial: { sets: 3, target: 6 }
    prerequisites:
      - node: bunny_hop_cartwheel
        level: 5
      - node: wall_handstand
        level: 5
        note: Kicking up to a handstand against the wall comes before the cartwheel (GymnasticsHQ).
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: bunny_hop_cartwheel
    cues:
      - Start sideways to a line, arms up by the ears, one leg lifted in the direction of travel.
      - Lunge in and down; place hand, hand on the line, fingers turned sideways.
      - Legs split wide and pass through vertical; land foot, foot close to the hands, arms up.
    sources:
      - https://www.nrgq.co.uk/wp-content/uploads/2018/12/Foundation_Teaching-Progressions-CARTWHEELS.pdf
      - https://gymnasticshq.com/how-to-do-a-cartwheel/
      - https://gmb.io/tumbling/
    verify: >-
      Not levelled in OG2 (2 inferred, next to the wall handstand); the 3 x 6 trial is a placeholder.
      NRG notes narrow side splits and tight shoulders make it harder.
    review:
      status: draft
      notes: ""

  - id: quarter_turn_cartwheel
    name: Cartwheel with a quarter turn (front to back)
    order: 100
    og_level: 2
    metric: reps
    working_range: { min: 3, max: 6 }
    trial: { sets: 3, target: 6 }
    prerequisites:
      - node: cartwheel
        level: 5
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: cartwheel
    cues:
      - Start facing along the line, not sideways.
      - First hand as in the cartwheel; turn the second hand in so its fingers point back.
      - Finish facing where you started from, usually in a lunge.
    sources:
      - https://www.nrgq.co.uk/wp-content/uploads/2018/12/Foundation_Teaching-Progressions-CARTWHEELS.pdf
    verify: >-
      NRG calls it the prerequisite of the round-off; OG level 2 is inferred and the 3 x 6 trial is
      a placeholder.
    review:
      status: draft
      notes: ""

  - id: one_handed_cartwheel
    name: One-handed cartwheel
    order: 110
    og_level: 3
    metric: reps
    working_range: { min: 3, max: 6 }
    trial: { sets: 3, target: 6 }
    prerequisites:
      - node: cartwheel
        level: 5
    skill: true
    patterns: [balance, mobility]
    equipment:
      - floor
    regression: cartwheel
    cues:
      - Place one hand, fingers sideways; the free arm sweeps down in front and out to the side.
      - Legs swing straight over the top with a tight torso.
      - First foot lands close to the hand; lift the chest quickly.
      - Stepping stone - put the second hand on top of the first as you go over.
    sources:
      - https://www.nrgq.co.uk/wp-content/uploads/2018/12/Developmental_Teaching-Progressions-ONE-HANDED-CARTWHEEL.pdf
      - https://gymnasticshq.com/how-to-do-a-cartwheel/
    verify: >-
      NRG: it needs the strength to hold the body on one arm; OG level 3 is inferred and the 3 x 6
      trial is a placeholder.
    review:
      status: draft
      notes: ""

  - id: round_off
    name: Round-off
    order: 120
    og_level: 3
    metric: reps
    working_range: { min: 3, max: 5 }
    trial: { sets: 3, target: 5 }
    prerequisites:
      - node: quarter_turn_cartwheel
        level: 5
        note: A good, straight front-to-back cartwheel with correct hand placement (NRG).
      - node: wall_handstand
        level: 5
        note: A strong, straight kick to handstand (NRG).
      - node: hollow_hold
        level: 5
        kind: recommended
        note: Good body tension and a dished exit.
    skill: true
    patterns: [balance, mobility, explosive]
    equipment:
      - floor
    regression: quarter_turn_cartwheel
    cues:
      - Step in with the arms by the ears, lunge deep and reach far forward.
      - Second hand turns to point backwards; head stays between the arms.
      - Snap the legs together after vertical and push hard through the shoulders.
      - Land on both feet facing back, in a dished (hollow) shape, not a pike.
    sources:
      - https://www.nrgq.co.uk/wp-content/uploads/2018/12/Developmental_Teaching-Progressions-ROUND-OFF.pdf
    verify: OG level 3 is inferred; the 3 x 5 trial is a placeholder.
    review:
      status: draft
      notes: ""

  # --- Top (legendary) ---
  - id: aerial_cartwheel
    name: Aerial cartwheel
    order: 130
    og_level: 6
    metric: reps
    working_range: { min: 1, max: 3 }
    trial: { sets: 3, target: 3 }
    prerequisites:
      - node: round_off
        level: 5
        note: Teaches the push off the legs.
      - node: one_handed_cartwheel
        level: 5
    skill: true
    patterns: [balance, mobility, explosive]
    equipment:
      - floor
    regression: one_handed_cartwheel
    legendary: true
    cues:
      - Learn it with a coach and on a soft mat first, ideally off a raised surface.
      - Drill needle kicks and fast, close cartwheels before taking the hands away.
      - Drive hard with the back leg and lift the chest; the legs do the work, not the arms.
    sources:
      - https://gymnasticshq.com/how-to-do-an-aerial-cartwheel/
      - https://en.wikipedia.org/wiki/Aerial_cartwheel
    verify: >-
      Not levelled in OG2; 6 (FIG A range) is inferred. The 3 x 3 trial is a placeholder. The
      sources advise a spotter and mats, which this app cannot check.
    review:
      status: draft
      notes: ""

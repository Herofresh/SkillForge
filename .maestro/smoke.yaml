# Smoke test: the app starts in Expo Go, the database migrates and every tab renders.
#
# Prerequisites (see docs/CONTEXT.md "E2E tests"):
#   1. An Android emulator (or phone) is running and visible to `adb devices`.
#   2. The dev server runs on port 8081: `npx expo start`.
#   3. `adb reverse tcp:8081 tcp:8081` so the device can reach Metro at 127.0.0.1.
# Run: npm run e2e
appId: host.exp.exponent
name: Smoke - app opens and all tabs render
---
- openLink: exp://127.0.0.1:8081
# Wait for the app. It may still be open where an earlier flow left it: any tab, the Style Guide or
# an onboarding step.
- extendedWaitUntil:
    visible: 'Tree|Style Guide|Step . / 5|Continue'
    timeout: 180000 # the first bundle on a cold emulator can take ~2 min
# Expo Go shows a one-time developer menu intro on first launch.
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# On a fresh install the dev menu then stays open over the app: close it.
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - back
- runFlow:
    when:
      visible:
        id: 'styleguide'
    commands:
      - back
# First run (PLAN 4.1): finish onboarding if it is showing.
- runFlow: subflows/finish-onboarding.yaml
- tapOn: 'Tree'
- assertVisible: 'Skill Tree'
- tapOn: 'Train'
- assertVisible:
    id: 'train-screen'
- tapOn: 'Character'
- assertVisible:
    id: 'character-screen'
- tapOn: 'Settings'
- assertVisible:
    id: 'settings-screen'
# The seeded equipment profiles come from SQLite (PLAN 3.1): proof that migrations and loading work.
# (The tab keeps its scroll position from earlier flows: scroll up to the profiles first.)
- scrollUntilVisible:
    element:
      id: 'settings-hero-name'
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element: 'Home'
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: 'Park'
    direction: DOWN
    timeout: 60000
- tapOn: 'Tree'
- assertVisible: 'Skill Tree'

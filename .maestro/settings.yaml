# Settings (PLAN 4.6): add and remove an equipment profile, export a backup (the share sheet opens
# and is closed with back; skipped when none shows), the import's cancel paths (the confirmation,
# then the file picker), the guide (PLAN 6.10c: the widgets' "i", the guide list and one page) and
# replaying onboarding (PLAN 5.10). Takes the 4.6 and 6.10c settings screenshots.
# Prerequisites and run: see smoke.yaml / docs/CONTEXT.md.
appId: host.exp.exponent
name: Settings - equipment profile, export, import cancel
---
- openLink: exp://127.0.0.1:8081
# Wait for the app. It may still be open where an earlier flow left it.
- extendedWaitUntil:
    visible: 'Tree|Style Guide|Step . / 5|Continue|Settings'
    timeout: 180000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - back
- runFlow:
    when:
      visible:
        id: 'styleguide'
    commands:
      - back
- runFlow:
    when:
      visible:
        id: 'past-session'
    commands:
      - back
- runFlow: subflows/finish-onboarding.yaml
- tapOn: 'Settings'
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 20000
# The tab keeps its scroll position from an earlier run: go back to the top.
- scrollUntilVisible:
    element:
      id: 'settings-hero-name'
    direction: UP
    timeout: 60000
- assertVisible: 'Home'
- takeScreenshot: 4.6-settings
# Add a profile, then remove it (with the confirmation)
- scrollUntilVisible:
    element:
      id: 'new-profile-input'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'new-profile-input'
- inputText: 'Gym'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'add-profile'
    direction: DOWN
    timeout: 60000
# Adding dismisses the keyboard (no hideKeyboard here: its back press would leave the tab).
- tapOn:
    id: 'add-profile'
- scrollUntilVisible:
    element: 'Gym'
    direction: UP
    timeout: 60000
- assertVisible: 'Gym'
- scrollUntilVisible:
    element:
      id: 'remove-(?!home|park).*'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'remove-(?!home|park).*'
- extendedWaitUntil:
    visible:
      id: 'remove-dialog'
    timeout: 20000
- tapOn:
    id: 'remove-confirm'
- extendedWaitUntil:
    notVisible: 'Gym'
    timeout: 20000
# Export: the Android share sheet opens; close it with back
- scrollUntilVisible:
    element:
      id: 'export-backup'
    direction: DOWN
    timeout: 60000
- takeScreenshot: 4.6-backup
- tapOn:
    id: 'export-backup'
- extendedWaitUntil:
    notVisible:
      id: 'settings-screen'
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings-screen'
    commands:
      - takeScreenshot: 4.6-share-sheet
      - back
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 20000
# Import: the confirmation says it replaces all data; cancel it
- scrollUntilVisible:
    element:
      id: 'import-backup'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'import-backup'
- extendedWaitUntil:
    visible:
      id: 'import-dialog'
    timeout: 20000
- assertVisible: 'Replace all data?'
- takeScreenshot: 4.6-import-confirm
- tapOn: 'Cancel'
- extendedWaitUntil:
    notVisible:
      id: 'import-dialog'
    timeout: 20000
# Import again, confirm, and back out of the file picker: nothing changes
- tapOn:
    id: 'import-backup'
- extendedWaitUntil:
    visible:
      id: 'import-dialog'
    timeout: 20000
- tapOn:
    id: 'import-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'settings-screen'
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings-screen'
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: 'backup-canceled'
    timeout: 20000
# How SkillForge works (PLAN 6.10c): the widgets' "i", then the guide, one page and back.
- scrollUntilVisible:
    element:
      id: 'open-guide'
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'guide-widgets'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'guide-widgets'
- extendedWaitUntil:
    visible:
      id: 'guide-widgets-sheet'
    timeout: 20000
- assertVisible: 'Home-screen widgets'
- takeScreenshot: 6.10c-settings-widgets-sheet
- tapOn:
    id: 'guide-widgets-sheet-close'
- extendedWaitUntil:
    notVisible:
      id: 'guide-widgets-sheet'
    timeout: 20000
- takeScreenshot: 6.10c-settings-panel
- tapOn:
    id: 'open-guide'
- extendedWaitUntil:
    visible:
      id: 'guide-screen'
    timeout: 20000
- takeScreenshot: 6.10c-guide
- scrollUntilVisible:
    element:
      id: 'guide-row-ranks'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'guide-row-ranks'
- extendedWaitUntil:
    visible:
      id: 'guide-page-ranks'
    timeout: 20000
- assertVisible: '.*7 of the 12 branches.*'
- takeScreenshot: 6.10c-guide-ranks
- back
- extendedWaitUntil:
    visible:
      id: 'guide-screen'
    timeout: 20000
- back
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 20000
# Replay onboarding (PLAN 5.10): the confirmation says the data stays; the intro opens with the
# stored hero name, and finishing it lands on the tree again. It sits above the guide panel.
- scrollUntilVisible:
    element:
      id: 'replay-onboarding'
    direction: UP
    timeout: 60000
- tapOn:
    id: 'replay-onboarding'
- extendedWaitUntil:
    visible:
      id: 'replay-dialog'
    timeout: 20000
- assertVisible: 'Your data stays.*'
- tapOn:
    id: 'replay-confirm'
- extendedWaitUntil:
    visible:
      id: 'onboarding-hero'
    timeout: 20000
- runFlow: subflows/finish-onboarding.yaml
- assertVisible: 'Tree'

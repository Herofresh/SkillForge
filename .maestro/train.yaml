# Train flow (PLAN 4.4, 5.4, 5.9): from a fresh install, plan a 30-min Home session, look at the
# plan preview and a swap sheet, start it, time and log the first exercise's set, start the next
# set's timer, then kill the app and check that the session resumes with its sets and the running
# timer (the draft is saved after every change), edit the logged set, move an exercise down, finish
# it and see the summary with XP > 0. Prerequisites and run: see smoke.yaml / docs/CONTEXT.md.
appId: host.exp.exponent
name: Train - plan, live session, resume after a restart, summary
---
# Fresh data, so the generated plan is known (wipes Expo Go's data, including the app database).
- clearState
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: 'Name your hero|Continue'
    timeout: 180000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: 'onboarding-hero'
    timeout: 60000
- runFlow: subflows/finish-onboarding.yaml
# Train now: Home, 30 min
- tapOn: 'Train'
- extendedWaitUntil:
    visible:
      id: 'train-now'
    timeout: 20000
- tapOn:
    id: 'profile-home'
- tapOn:
    id: 'minutes-30'
- takeScreenshot: 4.4-train
- tapOn:
    id: 'train-now'
# Plan preview: blocks with prescriptions; open a swap sheet and cancel it
- extendedWaitUntil:
    visible:
      id: 'plan-preview'
    timeout: 20000
- assertVisible:
    id: 'plan-e0-prescription'
- takeScreenshot: 4.4-plan-preview
- tapOn:
    id: 'swap-e0'
- extendedWaitUntil:
    visible:
      id: 'swap-sheet'
    timeout: 20000
- takeScreenshot: 4.4-swap
- tapOn: 'Cancel'
- extendedWaitUntil:
    notVisible:
      id: 'swap-sheet'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'start-session'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'start-session'
# Live session: the first exercise (the warm-up's wrist prep, 1 set)
- extendedWaitUntil:
    visible:
      id: 'live-session'
    timeout: 20000
- assertVisible:
    id: 'set-label'
    text: 'Set 1 of 1'
- assertVisible:
    id: 'session-clock'
- takeScreenshot: 4.4-session
# Exercise timer (5.4): start it, stop it (a hold shows Stop after its 3 s get-ready), log the set
- tapOn:
    id: 'set-timer-start'
- extendedWaitUntil:
    visible:
      id: 'set-timer-stop'
    timeout: 20000
- takeScreenshot: 5.4-timer
- tapOn:
    id: 'set-timer-stop'
- assertVisible:
    id: 'set-timer-reset'
- scrollUntilVisible:
    element:
      id: 'log-set'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'log-set'
- extendedWaitUntil:
    visible:
      id: 'rest-panel'
    timeout: 20000
- assertVisible:
    id: 'session-progress'
- takeScreenshot: 4.4-rest
# Starting the next set's timer ends the rest
- scrollUntilVisible:
    element:
      id: 'set-timer-start'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'set-timer-start'
- extendedWaitUntil:
    notVisible:
      id: 'rest-panel'
    timeout: 20000
# Kill the app mid-session and open it again: it resumes with the logged set
- stopApp
- launchApp
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: 'resume-session'
    timeout: 120000
- takeScreenshot: 4.4-resume
- tapOn:
    id: 'resume-session'
- extendedWaitUntil:
    visible:
      id: 'live-session'
    timeout: 20000
- assertVisible:
    id: 'set-timer-clock'
- tapOn:
    id: 'set-timer-reset'
- assertVisible:
    id: 'set-timer-start'
- scrollUntilVisible:
    element:
      id: 'session-row-e0'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'session-row-e0'
    text: '.*1 / 1.*'
# Edit the logged set (5.9): show the first exercise again, tap its set, step up and save
- tapOn:
    id: 'session-row-e0'
- scrollUntilVisible:
    element:
      id: 'logged-set-0'
    direction: UP
    timeout: 60000
- tapOn:
    id: 'logged-set-0'
- extendedWaitUntil:
    visible:
      id: 'edit-set-sheet'
    timeout: 20000
- tapOn:
    id: 'edit-set-stepper-plus'
- takeScreenshot: 5.9-edit-set
- tapOn:
    id: 'edit-set-save'
- extendedWaitUntil:
    notVisible:
      id: 'edit-set-sheet'
    timeout: 20000
# Reorder (5.9): move the first exercise down, then leave the reorder mode
- scrollUntilVisible:
    element:
      id: 'session-reorder'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'session-reorder'
- tapOn:
    id: 'move-down-e0'
- takeScreenshot: 5.9-reorder
- tapOn:
    id: 'session-reorder'
# Finish (confirm) and see the summary
- scrollUntilVisible:
    element:
      id: 'finish-session'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'finish-session'
- extendedWaitUntil:
    visible:
      id: 'finish-dialog'
    timeout: 20000
- tapOn:
    id: 'finish-confirm'
- extendedWaitUntil:
    visible:
      id: 'session-summary'
    timeout: 20000
- assertVisible:
    id: 'summary-total-xp'
    text: '\+[1-9][0-9]* XP'
- takeScreenshot: 4.4-summary
- scrollUntilVisible:
    element:
      id: 'summary-done'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'summary-done'
- extendedWaitUntil:
    visible:
      id: 'train-now'
    timeout: 20000

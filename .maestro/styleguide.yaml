# Design system (PLAN 4.0): the dev-only Style Guide opens from Settings and its interactive parts
# work (warning acknowledge, modal). Prerequisites and run: see smoke.yaml / docs/CONTEXT.md.
appId: host.exp.exponent
name: Style guide - components render and respond
---
- openLink: exp://127.0.0.1:8081
# Wait for the app. It may still be open where an earlier flow left it: any tab, the Style Guide or
# an onboarding step.
- extendedWaitUntil:
    visible: 'Tree|Style Guide|Step . / 5|Continue'
    timeout: 180000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# On a fresh install the dev menu then stays open over the app: close it.
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - back
- runFlow:
    when:
      visible:
        id: 'styleguide'
    commands:
      - back
# First run (PLAN 4.1): finish onboarding if it is showing.
- runFlow: subflows/finish-onboarding.yaml
- tapOn: 'Tree'
- assertVisible: 'Skill Tree'
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: 'open-styleguide'
    direction: DOWN
    timeout: 90000 # a long page on a software-rendered emulator
- tapOn:
    id: 'open-styleguide'
- extendedWaitUntil:
    visible:
      id: 'styleguide'
    timeout: 20000
- assertVisible: 'Typography'
- scrollUntilVisible:
    element:
      id: 'demo-warning-acknowledge'
    direction: DOWN
    timeout: 90000 # a long page on a software-rendered emulator
- tapOn:
    id: 'demo-warning-acknowledge'
- assertVisible:
    id: 'demo-warning-acknowledged'
- scrollUntilVisible:
    element:
      id: 'open-modal'
    direction: DOWN
    timeout: 90000 # a long page on a software-rendered emulator
- tapOn:
    id: 'open-modal'
- assertVisible: 'Choose a profile'
- tapOn: 'Close'
- assertNotVisible: 'Choose a profile'
- scrollUntilVisible:
    element: 'Replay burst'
    direction: DOWN
    timeout: 90000 # a long page on a software-rendered emulator
- tapOn: 'Replay burst'
- assertVisible: 'LEVEL UP!'
- back
- assertVisible:
    id: 'open-styleguide'

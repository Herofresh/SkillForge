# Subflow (not run on its own): if the app shows the first-run flow (PLAN 4.1), finish it with the
# least input (a hero name, keep the equipment, goals "Later", no assessment) so the other flows can
# test the tabs. Works from any onboarding step, since Expo Go keeps the last screen.
appId: host.exp.exponent
---
- repeat:
    times: 10 # safety net; onboarding has 5 steps
    while:
      notVisible: 'Tree'
    commands:
      - runFlow:
          when:
            visible:
              id: 'trial-form'
          commands:
            - back
      - runFlow:
          when:
            visible:
              id: 'onboarding-hero'
          commands:
            - tapOn:
                id: 'hero-name-input'
            - eraseText: 30
            - inputText: 'Smoke'
            # The keyboard can cover Next; close it with Back only then (hideKeyboard presses Back even
            # when only the keyboard toolbar shows, which leaves the app).
            - runFlow:
                when:
                  notVisible:
                    id: 'onboarding-next'
                commands:
                  - back
      - runFlow:
          when:
            visible:
              id: 'onboarding-goals'
          commands:
            - tapOn:
                id: 'onboarding-skip'
      - runFlow:
          when:
            visible:
              id: 'onboarding-next'
          commands:
            - tapOn:
                id: 'onboarding-next'

# Character tab (PLAN 4.5): from a fresh install the sheet shows level 1 and an empty history; after
# a logged session it shows the earned XP and the session, which opens its summary. Takes the 4.5
# screenshots. The rank crest opens and closes the rank ladder (PLAN 6.7, 6.7 screenshots); the class
# banner opens and closes the class sheet (PLAN 6.9, 6.9 screenshots). The weekly class challenge
# (PLAN 6.9b): the Recruit's "2 sessions" card, its line in the class sheet, 1 / 2 on the first
# session's summary, CHALLENGE COMPLETE! on a second one and the COMPLETE tag (6.9b screenshots).
# The companion (PLAN 6.10) waits for the first quest, its Customize sheet opens and closes; after
# the session it is fired up and a tap makes it wave (6.10 screenshots).
# Prerequisites and run: see smoke.yaml / docs/CONTEXT.md.
appId: host.exp.exponent
name: Character - level and XP after a logged session, history opens the session
---
# Fresh data, so the sheet starts empty (wipes Expo Go's data, including the app database).
- clearState
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: 'Name your hero|Continue'
    timeout: 180000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: 'onboarding-hero'
    timeout: 60000
- runFlow: subflows/finish-onboarding.yaml
# A new hero: no XP, an empty radar
- tapOn: 'Character'
- extendedWaitUntil:
    visible:
      id: 'character-screen'
    timeout: 20000
- assertVisible:
    id: 'character-total-xp'
    text: '0 XP earned in total'
# 6.10: the companion waits for the first quest and carries the Recruit's wooden sword
- assertVisible:
    id: 'companion-mood'
    text: 'Restless'
- assertVisible:
    id: 'companion-weapon'
    text: 'Wooden training sword'
- takeScreenshot: 6.10-character-companion
- tapOn:
    id: 'companion-customize'
- extendedWaitUntil:
    visible:
      id: 'companion-sheet'
    timeout: 20000
- assertVisible:
    id: 'companion-sheet-weapon'
    text: 'Wooden training sword'
- tapOn:
    id: 'companion-sheet-skin-tan'
- takeScreenshot: 6.10-customize
- scrollUntilVisible:
    element:
      id: 'companion-sheet-head-golden_crown-locked'
    direction: DOWN
    timeout: 30000
- takeScreenshot: 6.10-customize-locked
- tapOn:
    id: 'companion-sheet-close'
- extendedWaitUntil:
    notVisible:
      id: 'companion-sheet'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'attribute-radar'
    direction: DOWN
    timeout: 30000
# 6.7: the rank crest opens the rank ladder: Novice is the hero's rank, Apprentice the next one
- scrollUntilVisible:
    element:
      id: 'character-rank'
    direction: UP
    timeout: 30000
- tapOn:
    id: 'character-rank'
- extendedWaitUntil:
    visible:
      id: 'rank-ladder'
    timeout: 20000
- assertVisible:
    id: 'rank-ladder-novice-status'
    text: 'Your rank'
- assertVisible:
    id: 'rank-ladder-apprentice-status'
    text: 'Next rank'
- takeScreenshot: 6.7-rank-ladder
- scrollUntilVisible:
    element:
      id: 'rank-ladder-legend-status'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: 'rank-ladder-legend-status'
    text: 'Locked'
- takeScreenshot: 6.7-rank-ladder-locked
- tapOn:
    id: 'rank-ladder-close'
- extendedWaitUntil:
    notVisible:
      id: 'rank-ladder'
    timeout: 20000
- assertVisible:
    id: 'character-screen'
# 6.9: a new hero wears the starting class; the banner opens the class sheet
- assertVisible:
    id: 'character-class-title'
    text: 'Recruit'
- takeScreenshot: 6.9-character-class
- tapOn:
    id: 'character-class'
- extendedWaitUntil:
    visible:
      id: 'class-sheet'
    timeout: 20000
- assertVisible:
    id: 'class-sheet-recruit-status'
    text: 'Wearing'
- assertVisible:
    id: 'class-sheet-warrior-status'
    text: 'Locked'
- assertVisible:
    id: 'class-sheet-warrior-progress'
    text: 'Push 0 / 30'
- assertVisible:
    id: 'class-sheet-recruit-challenge'
    text: 'Weekly challenge: Train in 2 sessions'
- takeScreenshot: 6.9-class-sheet
- takeScreenshot: 6.9b-class-sheet
- scrollUntilVisible:
    element:
      id: 'class-sheet-sorcerer-status'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- assertVisible:
    id: 'class-sheet-sorcerer-status'
    text: 'Locked'
- takeScreenshot: 6.9-class-sheet-locked
- tapOn:
    id: 'class-sheet-close'
- extendedWaitUntil:
    notVisible:
      id: 'class-sheet'
    timeout: 20000
- assertVisible:
    id: 'character-screen'
# 6.9b: the Recruit's weekly challenge, previewed until the first session of the week
- scrollUntilVisible:
    element:
      id: 'character-challenge'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: 'character-challenge-goal'
    text: 'Train in 2 sessions this week'
- assertVisible:
    id: 'character-challenge-count'
    text: '0 / 2 sessions'
- takeScreenshot: 6.9b-character-challenge
# Log a short session: Train now (Home, 30 min) → start → log the first set → finish
- runFlow: subflows/log-short-session.yaml
# 6.9b: the summary shows the challenge's progress (1 / 2)
- scrollUntilVisible:
    element:
      id: 'summary-challenge'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'summary-challenge-count'
    text: '1 / 2 sessions'
- assertVisible:
    id: 'summary-challenge-line'
    text: '\+1 this session'
- takeScreenshot: 6.9b-summary-progress
- scrollUntilVisible:
    element:
      id: 'summary-done'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'summary-done'
- extendedWaitUntil:
    visible:
      id: 'train-now'
    timeout: 20000
# The sheet now shows the XP and the session
- tapOn: 'Character'
- extendedWaitUntil:
    visible:
      id: 'character-screen'
    timeout: 20000
- assertVisible:
    id: 'character-total-xp'
    text: '[1-9][0-9]* XP earned in total'
- assertVisible:
    id: 'character-xp'
- takeScreenshot: 4.5-character
# 6.10: a session cheers the companion up; a tap plays the exercise it trained
- scrollUntilVisible:
    element:
      id: 'companion-mood'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: 'companion-mood'
    text: 'Fired up'
- takeScreenshot: 6.10-character-companion-happy
- tapOn:
    id: 'companion-sprite'
- takeScreenshot: 6.10-companion-tap
- scrollUntilVisible:
    element:
      id: 'recent-session-0'
    direction: DOWN
    timeout: 60000
- takeScreenshot: 4.5-character-history
- tapOn:
    id: 'recent-session-0'
- extendedWaitUntil:
    visible:
      id: 'past-session'
    timeout: 20000
- assertVisible:
    id: 'summary-total-xp'
    text: '\+[1-9][0-9]* XP'
- takeScreenshot: 4.5-session
- back
- extendedWaitUntil:
    visible:
      id: 'character-screen'
    timeout: 20000
# 6.9b: a second session completes the Recruit's challenge: CHALLENGE COMPLETE! and the bonus
- runFlow: subflows/log-short-session.yaml
- scrollUntilVisible:
    element:
      id: 'summary-challenge'
    direction: DOWN
    timeout: 60000
- assertVisible: 'CHALLENGE COMPLETE!'
- assertVisible:
    id: 'summary-challenge-line'
    text: 'Complete! \+50 XP'
- takeScreenshot: 6.9b-summary-complete
- scrollUntilVisible:
    element:
      id: 'summary-done'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'summary-done'
- extendedWaitUntil:
    visible:
      id: 'train-now'
    timeout: 20000
- tapOn: 'Character'
- extendedWaitUntil:
    visible:
      id: 'character-screen'
    timeout: 20000
# The tab keeps its scroll position from the history above; the COMPLETE tag sits in an accessible
# row (one element for Maestro), so check the texts.
- scrollUntilVisible:
    element:
      id: 'character-challenge-count'
    direction: UP
    timeout: 60000
    centerElement: true
- assertVisible:
    id: 'character-challenge-count'
    text: '2 / 2 sessions'
- assertVisible: 'Complete: \+50 XP earned'
- assertVisible: 'Challenge badges: 1'
- takeScreenshot: 6.9b-character-challenge-complete

# Release upgrade check, step 1 of 2 (PLAN 5.7, ADR-043): run on the PREVIOUS release's APK
# (package at.skillforge.app). A fresh install walks through onboarding with a Pull-up test-out,
# so the database holds a hero, a goal and a logged Trial session.
# Then install the new APK over it (`adb install -r`) and run upgrade-verify.yaml.
# Runbook: docs/CONTEXT.md "Release upgrade check". Not part of `npm run e2e` (a subfolder).
appId: at.skillforge.app
name: Upgrade check 1 - seed data on the previous release
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: 'onboarding-hero'
    timeout: 60000
- tapOn:
    id: 'hero-name-input'
- inputText: 'Aria'
- hideKeyboard
- tapOn:
    id: 'onboarding-next'
- extendedWaitUntil:
    visible: 'Your armory'
    timeout: 20000
- tapOn:
    id: 'onboarding-next'
- extendedWaitUntil:
    visible: 'Choose your quests'
    timeout: 20000
- tapOn:
    id: 'branch-v_pull'
- scrollUntilVisible:
    element:
      id: 'goal-pull_up'
    direction: DOWN
    timeout: 90000
- tapOn:
    id: 'goal-pull_up'
- tapOn:
    id: 'onboarding-next'
- extendedWaitUntil:
    visible: 'Prove your might'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'anchor-pull_up'
    direction: DOWN
    timeout: 90000
- tapOn:
    id: 'anchor-pull_up'
- extendedWaitUntil:
    visible: 'The Trial'
    timeout: 20000
- tapOn:
    id: 'trial-warning-0-acknowledge'
- tapOn:
    id: 'onboarding-next' # Log Trial
- extendedWaitUntil:
    visible: 'TESTED OUT!'
    timeout: 20000
- tapOn:
    id: 'onboarding-next' # Done
- extendedWaitUntil:
    visible: 'Prove your might'
    timeout: 20000
- tapOn:
    id: 'onboarding-next' # Continue
- extendedWaitUntil:
    visible: 'Your journey begins'
    timeout: 20000
- tapOn:
    id: 'onboarding-next' # Begin
- extendedWaitUntil:
    visible: 'Skill Tree'
    timeout: 20000
- tapOn: 'Character'
- extendedWaitUntil:
    visible:
      id: 'character-screen'
    timeout: 20000
- assertVisible:
    id: 'hero-name'
    text: 'Aria'
- assertNotVisible:
    id: 'character-total-xp'
    text: '0 XP earned in total'
- takeScreenshot: 5.7-upgrade-before
# The user overlay: a custom exercise right after Tuck front lever. The ids exist since v0.1.0
# (the description field since v0.4.0, filled only when it is there).
- tapOn: 'Tree'
- extendedWaitUntil:
    visible:
      id: 'tree-screen'
    timeout: 20000
# The branch chips scroll sideways; Front lever is the fifth.
- repeat:
    times: 6
    while:
      notVisible:
        id: 'branch-front_lever'
    commands:
      - swipe:
          start: 85%, 21%
          end: 25%, 21%
          duration: 600
- tapOn:
    id: 'branch-front_lever'
- extendedWaitUntil:
    visible:
      id: 'tree-branch-title'
      text: 'Front lever'
    timeout: 20000
- tapOn:
    id: 'tree-add-exercise'
- extendedWaitUntil:
    visible:
      id: 'node-editor'
    timeout: 20000
- tapOn:
    id: 'editor-name'
- inputText: 'Lever hold'
- hideKeyboard
- tapOn:
    id: 'editor-change-position'
- extendedWaitUntil:
    visible:
      id: 'position-sheet'
    timeout: 20000
- tapOn:
    id: 'position-tuck_front_lever'
- assertVisible:
    id: 'editor-position'
    text: 'Tuck front lever'
# Since v0.4.0 (6.2) a custom exercise needs a description; older releases have no such field.
# If the field is missing on a release that needs it, the editor-status check below fails.
- runFlow:
    when:
      visible:
        id: 'editor-description-input'
    commands:
      - tapOn:
          id: 'editor-description-input'
      - inputText: 'A front lever hold with the knees tucked to the chest.'
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: 'editor-add-prerequisite'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'editor-add-prerequisite'
- extendedWaitUntil:
    visible:
      id: 'prerequisite-sheet'
    timeout: 20000
- tapOn:
    id: 'prerequisite-sheet-search'
- inputText: 'Tuck front'
- hideKeyboard
- tapOn:
    id: 'option-tuck_front_lever'
- scrollUntilVisible:
    element:
      id: 'editor-save'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'editor-status'
    text: 'The tree stays valid with these changes.'
- tapOn:
    id: 'editor-save'
- extendedWaitUntil:
    visible:
      id: 'node-detail'
    timeout: 20000
- back
- extendedWaitUntil:
    visible:
      id: 'tile-custom-user_lever_hold'
    timeout: 20000
- takeScreenshot: upgrade-before-overlay

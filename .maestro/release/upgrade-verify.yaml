# Release upgrade check, step 2 of 2 (PLAN 5.7, ADR-043): run after installing the NEW APK over the
# previous release seeded by upgrade-seed.yaml (`adb install -r`, no uninstall, no clearState).
# The hero, the goal, the logged Trial session and its XP must all still be there, and so must the
# custom exercise "Lever hold" the seed placed after Tuck front lever (its order now clashes with a
# built-in node; ADR-052 resolves it instead of dropping the whole overlay).
appId: at.skillforge.app
name: Upgrade check 2 - data survives the update
---
- launchApp
- extendedWaitUntil:
    visible: 'Skill Tree'
    timeout: 60000
# Onboarding is not shown again: the completed profile survived.
- assertNotVisible:
    id: 'onboarding-hero'
- tapOn: 'Character'
- extendedWaitUntil:
    visible:
      id: 'character-screen'
    timeout: 20000
- assertVisible:
    id: 'hero-name'
    text: 'Aria'
# The seed's Pull-up test-out earns 40 XP on v0.1.0; same formulas, so the same total after update.
- assertVisible:
    id: 'character-total-xp'
    text: '40 XP earned in total'
- scrollUntilVisible:
    element:
      id: 'goal-pull_up'
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'recent-session-0'
    direction: DOWN
    timeout: 30000
- takeScreenshot: 5.7-upgrade-after
# The user overlay survived: the custom exercise is still in the Front lever column.
- tapOn: 'Tree'
- extendedWaitUntil:
    visible:
      id: 'tree-screen'
    timeout: 20000
- repeat:
    times: 6
    while:
      notVisible:
        id: 'branch-front_lever'
    commands:
      - swipe:
          start: 85%, 21%
          end: 25%, 21%
          duration: 600
- tapOn:
    id: 'branch-front_lever'
- extendedWaitUntil:
    visible:
      id: 'tree-branch-title'
      text: 'Front lever'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'tile-custom-user_lever_hold'
    direction: DOWN
    timeout: 60000
- takeScreenshot: upgrade-after-overlay
